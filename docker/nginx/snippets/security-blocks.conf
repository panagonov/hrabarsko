# Блокировки на пътища, търсени изключително от автоматизирани скенери.
# Адаптирано от /Volumes/storage/projects/docker/nginx/snippets/security-blocks.conf.
# Разлика: SLiMS е PHP приложение, затова *.php НЕ се блокира.
#
# 444 затваря връзката без отговор. Попаденията се виждат с:
#   docker compose logs nginx | grep BLOCKED

# Скрити конфигурационни и служебни файлове (.env, .git/config ...)
location ~* /\.(git|env|aws|ssh|svn|hg|bzr|htaccess|htpasswd|DS_Store|vscode|idea) {
    access_log /var/log/nginx/access.log blocked;
    return 444;
}

# WordPress и чужди админ панели
location ~* /(wp-admin|wp-login|wp-content|wp-includes|wordpress|xmlrpc\.php|phpmyadmin|pma|myadmin|adminer|vendor/phpunit|cgi-bin) {
    access_log /var/log/nginx/access.log blocked;
    return 444;
}

# Служебни директории и файлове на SLiMS, които не се отдават директно
location ~* ^/(config|install)/ {
    access_log /var/log/nginx/access.log blocked;
    return 444;
}
location ~* ^/files/backup/ {
    access_log /var/log/nginx/access.log blocked;
    return 444;
}
location ~* /(composer\.(json|lock)|sysconfig\.local\.inc\.php)$ {
    access_log /var/log/nginx/access.log blocked;
    return 444;
}

# Дъмпове, архиви и backup файлове
location ~* \.(sql|bak|old|swp|tar|gz|7z)$ {
    access_log /var/log/nginx/access.log blocked;
    return 444;
}
