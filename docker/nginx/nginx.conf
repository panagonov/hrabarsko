# Базиран на /Volumes/storage/projects/docker/nginx/nginx.conf, адаптиран за SLiMS.
# Логовете отиват в stdout/stderr на контейнера (docker compose logs nginx),
# защото официалният образ пренасочва access.log и error.log натам.
user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
	worker_connections 4096;
	multi_accept on;
}

http {
	##
	# Ограничения на скоростта
	##
	# На Docker Desktop за Mac всички клиенти изглеждат като един IP, затова е 150r/s (виж slims.conf.template).
	limit_req_zone  $binary_remote_addr zone=zone_general:10m rate=150r/s;
	limit_conn_zone $binary_remote_addr zone=conn_perip:10m;

	# Вход в SLiMS (библиотекари): POST към index.php?p=login.
	# Празен ключ означава "без ограничение", така че зоната засяга само опитите за вход.
	map "$request_method:$arg_p" $slims_login_key {
		default      "";
		"POST:login" $binary_remote_addr;
	}
	limit_req_zone  $slims_login_key zone=zone_auth:10m rate=10r/m;

	limit_req_status  429;
	limit_conn_status 429;

	##
	# Таймаути срещу бавни атаки (Slowloris)
	# Те са между две последователни операции четене/запис, не общи за заявката,
	# затова голямо качване не се засяга, докато данните текат.
	##
	client_body_timeout       15s;
	client_header_timeout     10s;
	send_timeout              15s;
	reset_timedout_connection on;
	client_header_buffer_size 1k;
	large_client_header_buffers 4 8k;

	##
	# Логове
	##
	log_format security '$remote_addr - $remote_user [$time_local] '
	                    '"$request" $status $body_bytes_sent '
	                    '"$http_referer" "$http_user_agent" '
	                    'rt=$request_time urt="$upstream_response_time" host="$host"';

	# Попаденията в security-blocks.conf, с префикс за лесно филтриране:
	#   docker compose logs nginx | grep BLOCKED
	log_format blocked 'BLOCKED $remote_addr [$time_local] "$request" '
	                   '"$http_user_agent" host="$host"';

	access_log /var/log/nginx/access.log security;
	error_log  /var/log/nginx/error.log warn;

	## Блокирани IP адреси ##
	include /etc/nginx/blockips.conf;

	##
	# Основни настройки
	##
	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout 30s;
	keepalive_requests 1000;
	types_hash_max_size 2048;
	client_max_body_size 10m;
	server_tokens off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# TLS: само 1.2 и 1.3. OCSP stapling не се включва, защото
	# Let's Encrypt прекрати OCSP услугата.
	##
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
	ssl_prefer_server_ciphers off;
	ssl_session_cache shared:SSL:10m;
	ssl_session_timeout 1d;
	ssl_session_tickets off;

	##
	# Gzip
	##
	gzip on;
	gzip_disable "msie6";

	##
	# WebSocket upgrade: "upgrade" само при реално поискан upgrade.
	##
	map $http_upgrade $connection_upgrade {
		default upgrade;
		''      close;
	}

	##
	# X-Forwarded-For = реалният TCP източник. Няма CDN отпред, така че
	# клиентът не може да подправи IP адреса си чрез собствен header.
	##
	proxy_set_header X-Forwarded-For $remote_addr;

	include /etc/nginx/sites-enabled/*;
}
